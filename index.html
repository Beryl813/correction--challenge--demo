<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>改错挑战赛 Demo</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --ink: #202228;
      --muted: #8a8f97;
      --line: #e8eaf0;
      --grouped: #f5f7fb;
      --purple: #7047f5;
      --purple-dark: #5633d8;
      --cyan: #1aaeba;
      --blue: #25a7f2;
      --green: #28c76f;
      --red: #f04a6a;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      background:
        linear-gradient(rgba(217, 224, 235, .48) 1px, transparent 1px),
        linear-gradient(90deg, rgba(217, 224, 235, .48) 1px, transparent 1px),
        #eef1f7;
      background-size: 24px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    }
    button, select, textarea { font: inherit; }
    button { border: 0; cursor: pointer; user-select: none; }
    button:disabled { cursor: default; }
    .workspace {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 280px minmax(375px, 1fr);
      gap: 36px;
      align-items: start;
      padding: 28px;
    }
    .control-panel { position: sticky; top: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
    .brand-mark {
      width: 44px; height: 44px; display: grid; place-items: center;
      border-radius: 12px; color: white; background: var(--purple);
      box-shadow: 0 8px 16px rgba(112, 71, 245, .25);
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand strong { display: block; font-size: 18px; line-height: 22px; }
    .brand span { display: block; margin-top: 2px; color: #858b95; font-size: 12px; }
    .panel-section { margin: 0 0 22px; }
    .panel-section h2 {
      margin: 0 0 10px; color: #68707b; font-size: 12px; font-weight: 700;
    }
    .control-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .control-button {
      min-height: 34px; display: inline-flex; align-items: center; gap: 5px;
      padding: 0 11px; border: 1px solid #d8dde8; border-radius: 8px;
      color: #5d6470; background: rgba(255, 255, 255, .86); font-size: 12px;
      transition: transform .1s ease, border-color .15s ease, color .15s ease, background .15s ease;
    }
    .control-button:active { transform: translateY(2px); }
    .control-button:hover, .control-button.is-active {
      border-color: var(--purple); color: var(--purple); background: #faf8ff;
    }
    .metric-list {
      overflow: hidden; border: 1px solid #dfe3ec; border-radius: 9px;
      background: rgba(255, 255, 255, .82);
    }
    .metric {
      display: flex; align-items: baseline; gap: 12px; padding: 10px 12px;
      border-bottom: 1px solid var(--line); color: #858b95; font-size: 12px;
    }
    .metric:last-child { border-bottom: 0; }
    .metric b { min-width: 25px; color: var(--ink); font-size: 16px; }
    .panel-note {
      display: flex; gap: 8px; margin-top: 14px; padding: 11px 12px;
      border-radius: 9px; color: #287153; background: #eafaf3; font-size: 12px; line-height: 17px;
    }
    .phone-stage { min-width: 0; display: flex; justify-content: center; }
    .phone {
      position: relative; width: min(100%, 430px); height: 840px; overflow: hidden;
      border: 8px solid #20242d; border-radius: 42px; background: var(--grouped);
      box-shadow: 0 20px 50px rgba(29, 35, 48, .22);
    }
    .status-bar {
      height: 30px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; color: #25272c; background: #edfbff; font-size: 13px; font-weight: 700;
      flex-shrink: 0;
    }
    .status-icons { display: inline-flex; align-items: center; gap: 5px; }
    .status-icons svg { width: 15px; height: 15px; }

    /* Native-style Layered Screen Stack (Smooth Transitions) */
    .screen-viewport {
      position: relative; width: 100%; height: 100%; overflow: hidden;
    }
    .app-screen {
      position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--grouped);
      transform: translate3d(0, 0, 0);
      transition: transform .34s cubic-bezier(.25, 1, .5, 1), opacity .34s cubic-bezier(.25, 1, .5, 1);
      will-change: transform, opacity;
    }
    .app-screen.is-left {
      transform: translate3d(-24%, 0, 0);
      opacity: 0.92;
      pointer-events: none;
    }
    .app-screen.is-right {
      transform: translate3d(100%, 0, 0);
      opacity: 0.92;
      pointer-events: none;
    }
    .app-screen.is-active {
      transform: translate3d(0, 0, 0);
      opacity: 1;
      pointer-events: auto;
    }

    .feed-top {
      flex: 0 0 128px; overflow: hidden; background: #edfbff;
      border-bottom: 3px solid #bdebe8; position: relative;
    }
    .feed-top::before, .feed-top::after {
      content: ""; position: absolute; top: 25px; width: 54px; height: 92px;
      pointer-events: none; transform: rotate(9deg); border-radius: 6px;
    }
    .feed-top::before { right: 84px; background: #ffd65a; opacity: 0.85; }
    .feed-top::after { right: 20px; background: #67d5cc; transform: rotate(15deg); opacity: 0.85; }
    .feed-top > * { position: relative; z-index: 1; }
    .h5-nav {
      height: 46px; display: grid; grid-template-columns: 40px 1fr auto;
      align-items: center; padding: 0 7px; color: #3f326b;
    }
    .h5-nav button, .native-nav button, .correction-native-nav button {
      width: 36px; height: 36px; display: grid; place-items: center; color: currentColor;
      background: transparent; border-radius: 50%; transition: transform .1s ease, background .15s ease;
    }
    .h5-nav button:active, .native-nav button:active, .correction-native-nav button:active {
      transform: scale(.9); background: rgba(112, 71, 245, .1);
    }
    .h5-title { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 16px; }
    .h5-title svg { color: var(--purple); }
    .h5-tools { display: inline-flex; align-items: center; gap: 1px; }
    .h5-tools button { position: relative; }
    .favorite-count {
      position: absolute; right: 1px; bottom: 2px; min-width: 15px; height: 15px;
      display: grid; place-items: center; padding: 0 3px; border: 2px solid #edfbff;
      border-radius: 99px; color: #fff; background: var(--purple); font-size: 8px; line-height: 11px;
      transition: transform .2s ease;
    }
    .favorite-count.bump { transform: scale(1.35); }

    .activity-summary {
      height: 79px; display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 0 14px 8px;
    }
    .activity-summary > div:first-child { display: grid; }
    .activity-summary small { color: #68737e; font-size: 9px; line-height: 12px; }
    .activity-summary strong { color: #6340dc; font-size: 19px; line-height: 23px; }
    .activity-summary strong span { display: inline-block; animation: count-pop .3s ease-out; }
    .summary-message {
      display: flex; align-items: center; gap: 6px; max-width: 160px; padding: 6px 8px;
      border: 1px solid rgba(255, 255, 255, .9); border-radius: 7px; color: #21494e;
      background: rgba(255, 255, 255, .9); box-shadow: 0 3px rgba(42, 133, 146, .16);
      font-size: 10px; line-height: 13px; font-weight: 700;
    }
    .summary-message svg { color: #1baeb0; flex: 0 0 auto; }
    .feed-scroll, .leader-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; }
    .feed-scroll::-webkit-scrollbar, .leader-body::-webkit-scrollbar { display: none; }
    .feed-intro {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 18px 14px 9px;
    }
    .feed-intro strong { min-width: 0; font-size: 14px; line-height: 20px; }
    .feed-filter label {
      height: 29px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px;
      border: 1px solid #dce3e8; border-radius: 7px; color: #296c83; background: #fff;
      box-shadow: 0 2px #e2e9ec;
    }
    .feed-filter select {
      width: 72px; min-width: 0; padding: 0; border: 0; outline: 0; color: #36515b;
      background: transparent; appearance: none; font-size: 10px; line-height: 13px; font-weight: 700;
    }
    .post-list { display: grid; gap: 10px; padding: 0 12px 30px; }
    .post-card {
      overflow: hidden; padding: 14px; border: 1px solid #e8eaf0; border-radius: 8px;
      background: #fff; box-shadow: 0 3px #e3e6ed; transform-origin: center top;
      transition: opacity .35s ease, transform .35s cubic-bezier(.2, .8, .2, 1),
                  max-height .38s cubic-bezier(.4, 0, .2, 1),
                  padding .38s ease, margin .38s ease, border-width .38s ease;
    }
    .post-card.exiting {
      max-height: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important;
      margin-top: 0 !important; margin-bottom: 0 !important; border-width: 0 !important;
      opacity: 0 !important; transform: translateY(-16px) scale(.97) !important;
    }
    .post-author { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 9px; }
    .post-avatar { position: relative; width: 38px; height: 38px; }
    .avatar-art {
      width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%;
      border: 2px solid #fff; color: #fff; font-size: 14px; font-weight: 800;
      box-shadow: 0 2px 6px rgba(39, 48, 64, .2);
    }
    .avatar-art.amber { background: linear-gradient(145deg, #f4c273, #b77743); }
    .avatar-art.pink { background: linear-gradient(145deg, #efb5d8, #788ce0); }
    .avatar-art.green { background: linear-gradient(145deg, #bce7bd, #52a986); }
    .avatar-art.blue { background: linear-gradient(145deg, #9bd7f5, #4f7bd9); }
    .nationality-badge {
      position: absolute; left: -4px; bottom: -3px; width: 18px; height: 18px; display: grid;
      place-items: center; border: 2px solid #fff; border-radius: 50%; background: #fff;
      box-shadow: 0 1px 3px rgba(31, 42, 55, .18); font-size: 11px; line-height: 1;
    }
    .post-author-info { min-width: 0; }
    .post-author-info > strong, .post-author-info > span { display: block; }
    .post-author strong { font-size: 14px; line-height: 19px; }
    .post-meta { display: flex !important; align-items: center; gap: 3px; color: #8a8f97; font-size: 10px; line-height: 14px; }
    .language-code { position: relative; display: inline-block !important; padding-bottom: 2px; color: #454a52; font-weight: 700; }
    .language-code::after { content: ""; position: absolute; right: 0; bottom: 0; left: 0; height: 2px; border-radius: 2px; }
    .native-language::after { background: #13c98b; }
    .learning-language::after { background: #7357f5; }
    .language-arrow { color: #b1b5bc; font-weight: 700; }
    .language-chip {
      display: inline-flex; align-items: center; gap: 4px; padding: 5px 7px; border-radius: 7px;
      color: #176f9f; background: #eaf7ff; font-size: 10px; line-height: 13px; font-weight: 700;
    }
    .post-text { margin: 15px 0 12px; color: #25282e; font-size: 16px; line-height: 24px; white-space: pre-line; }
    .community-signal {
      display: flex; align-items: center; gap: 6px; min-height: 27px; padding: 6px 8px;
      border-radius: 7px; color: #5f6b76; background: #f3f7f8; font-size: 10px; line-height: 14px;
    }
    .community-signal svg { color: #18a8b8; }
    .post-actions { display: grid; grid-template-columns: 1fr 1.12fr; gap: 9px; margin-top: 14px; padding-bottom: 3px; position: relative; }
    .tactile-button {
      min-width: 0; height: 43px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 16px; font-size: 13px; line-height: 18px; font-weight: 800;
      transition: transform 90ms ease, box-shadow 90ms ease, background .12s ease;
    }
    .tactile-button:active { transform: translateY(3px); }
    .secondary-action { border: 1px solid #dce1e9; color: #4c5560; background: #fff; box-shadow: 0 3px #dce1e9; }
    .secondary-action:active { box-shadow: 0 0 #dce1e9; }
    .primary-action { color: #fff; background: var(--purple); box-shadow: 0 4px var(--purple-dark); }
    .primary-action:active { background: #6540ea; box-shadow: 0 1px var(--purple-dark); }
    .perfect-action { position: relative; overflow: hidden; }
    .perfect-action.success { border-color: var(--blue); color: #fff; background: var(--blue); box-shadow: 0 3px #1688c7; animation: perfect-button-pop .62s cubic-bezier(.2, 1.4, .35, 1); }
    .perfect-action.error { border-color: #f4a8b7; color: #c63858; background: #fff1f4; box-shadow: 0 3px #f1bac5; animation: button-shake .36s ease; }
    
    /* Inline Correction (Refined with PM Suggestion Pill) */
    .inline-correction {
      margin: 15px -2px 0; overflow: hidden; border: 1px solid #e6e1ff; border-radius: 9px;
      background: #faf9ff;
    }
    .editing-context {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 11px; border-bottom: 1px solid #ebe7ff; color: #8a82ad; font-size: 10px; line-height: 15px;
    }
    .editing-context strong { color: #4f36b6; font-size: 12px; }
    
    /* Refined AI Suggestion Box (Structured, clean, prevents character wraps) */
    .ai-suggestion-box {
      margin: 10px 10px 12px;
      padding: 10px 12px;
      border-radius: 9px;
      background: #f6f3ff;
      border: 1px solid #e5dcff;
    }
    .ai-suggestion-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .ai-suggestion-title {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 800;
      color: var(--purple);
      white-space: nowrap;
    }
    .ai-suggestion-title svg { color: var(--purple); flex-shrink: 0; }
    .ai-apply-btn {
      height: 26px;
      padding: 0 10px;
      border-radius: 6px;
      color: #fff;
      background: var(--purple);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 5px rgba(112, 71, 245, .25);
      cursor: pointer;
      transition: transform .1s ease, background .1s ease;
    }
    .ai-apply-btn:active { transform: scale(0.96); background: var(--purple-dark); }
    .ai-suggestion-body {
      font-size: 11px;
      line-height: 16px;
      color: #433678;
    }
    .ai-suggestion-diff {
      margin-top: 6px;
      padding: 5px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .8);
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .diff-before { color: #d74460; text-decoration: line-through; }
    .diff-arrow { color: #9aa1ac; font-size: 10px; }
    .diff-after { color: #159b82; font-weight: 700; }

    .inline-line-list { display: grid; }
    .inline-line {
      display: grid; grid-template-columns: minmax(0, 1fr) 34px; align-items: center; gap: 6px;
      min-height: 53px; padding: 9px 8px 9px 11px; border-bottom: 1px solid #ebe7ff; background: #fff;
    }
    .inline-line:last-child { border-bottom: 0; }
    .inline-line-text {
      min-width: 0; padding: 5px 4px; color: #2b2e34; background: transparent;
      text-align: left; font-size: 13px; line-height: 20px; white-space: pre-wrap;
    }
    .inline-line-text:active { color: var(--purple); }
    .inline-line-edit {
      width: 32px; height: 32px; display: grid; place-items: center; justify-self: end;
      color: #7561d8; border-radius: 50%; background: #f2efff;
    }
    .inline-line-edit:active { color: #fff; background: var(--purple); transform: scale(.92); }
    .inline-line.is-editing {
      display: block; padding: 10px; background: #f8f6ff;
    }
    .inline-line textarea {
      width: 100%; min-height: 72px; display: block; resize: none; padding: 9px 10px;
      border: 1.5px solid var(--purple); border-radius: 8px; outline: none; color: #202228;
      background: #fff; box-shadow: 0 0 0 3px rgba(112,71,245,.1); font-size: 13px; line-height: 20px;
    }
    .inline-line-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 8px; }
    .inline-line-actions button {
      height: 31px; padding: 0 12px; border-radius: 7px; color: #727780; background: #eceef2;
      font-size: 11px; font-weight: 700;
    }
    .inline-line-actions .save-line {
      display: inline-flex; align-items: center; gap: 4px; color: #fff; background: var(--purple);
    }
    .inline-correction-error {
      display: flex; align-items: center; gap: 5px; padding: 8px 11px; color: #c63858;
      background: #fff0f3; font-size: 10px; line-height: 14px;
    }
    .inline-publish-wrap {
      padding: 10px; border-top: 1px solid #ebe7ff; background: #faf9ff;
    }
    .inline-publish-wrap button {
      width: 100%; height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 9px; color: #fff; background: var(--purple); box-shadow: 0 3px var(--purple-dark);
      font-size: 12px; font-weight: 800; transition: transform .1s ease, box-shadow .1s ease;
    }
    .inline-publish-wrap button:active { transform: translateY(2px); box-shadow: 0 1px var(--purple-dark); }
    .inline-correction-cancel {
      width: 100%; margin-top: 9px; color: #8a8f97; background: transparent; font-size: 10px; line-height: 16px;
    }

    /* Result Card (Fixed icon overlap bug on long sentences) */
    .result-card { padding: 0; border: 0; box-shadow: 0 3px #e3e6ed; }
    .result-card .result-top { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px 11px; border-bottom: 1px solid var(--line); }
    .result-card .result-top strong { font-size: 14px; }
    .result-card .result-label { margin-bottom: 7px; color: #7e8791; font-size: 10px; font-weight: 700; }
    .result-card .result-block { padding: 13px 14px; }
    .result-card .result-block + .result-block { border-top: 1px solid var(--line); }
    .sentence { margin: 0; color: #2b2e34; font-size: 14px; line-height: 22px; }
    .wrong { color: var(--red); text-decoration: line-through; text-decoration-thickness: 2px; }
    .correct { color: #159b82; font-weight: 800; }
    .result-change { padding: 13px 14px 14px; border-top: 1px solid var(--line); }
    .result-change-row + .result-change-row { margin-top: 12px; }
    .result-change-text {
      position: relative; margin: 0; padding: 11px 13px; border: 0;
      border-radius: 9px; color: #202228; font-size: 14px; line-height: 22px;
      white-space: pre-wrap;
    }
    .result-change-text.before { background: #fff1f3; }
    .result-change-text.after { margin-top: 7px; background: #eefaf7; }
    .result-change-text::before { display: block; margin-bottom: 5px; color: #7e8791; font-size: 10px; font-weight: 800; }
    .result-change-text.before::before { content: "修改前"; color: #d74460; }
    .result-change-text.after::before { content: "修改后"; color: #159b82; }
    .result-change-text .wrong {
      color: var(--red); text-decoration: underline; text-decoration-thickness: 2px;
      text-underline-offset: 3px; text-decoration-color: var(--red);
    }
    .result-change-text .correct {
      color: #159b82; font-weight: 700; text-decoration: underline;
      text-decoration-thickness: 2px; text-underline-offset: 3px;
      text-decoration-color: #159b82;
    }
    .result-actions { display: grid; grid-template-columns: 96px 1fr; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--line); }
    .result-action {
      min-height: 42px; padding: 0 10px; border-radius: 11px; font-size: 12px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      cursor: pointer; transition: transform 90ms ease, box-shadow 90ms ease, background .15s ease, border-color .15s ease;
    }
    .result-action:active { transform: translateY(2px); }
    .result-action.fav {
      border: 1px solid #d9dfe9; color: #596473; background: #fff; box-shadow: 0 2px #e3e7ee;
    }
    .result-action.fav.is-saved {
      border-color: #ffb020; color: #b37300; background: #fffbf0; box-shadow: 0 2px #ffe3a3;
    }
    .result-action.fav.is-saved svg { color: #ffb020; fill: #ffb020; }
    .result-action.next {
      border: none; color: #fff; background: var(--purple); box-shadow: 0 3px var(--purple-dark); font-size: 13px;
    }
    .result-action.next:active { box-shadow: 0 1px var(--purple-dark); }
    .result-action.save { border-color: var(--purple); color: #fff; background: var(--purple); box-shadow: 0 3px var(--purple-dark); }
    .result-action.skip { box-shadow: 0 3px #dfe3ea; }
    .completed { display: flex; align-items: center; gap: 8px; padding: 13px 14px; color: #337c68; background: #eefaf5; font-size: 11px; line-height: 16px; }
    .completed svg { flex: 0 0 auto; }
    .load-more { min-height: 74px; display: flex; align-items: center; justify-content: center; gap: 7px; color: #93979e; font-size: 11px; }
    .load-more button { display: inline-flex; align-items: center; gap: 7px; color: inherit; background: transparent; }
    .empty { padding: 55px 24px; text-align: center; color: #858b95; font-size: 12px; line-height: 18px; }
    .empty strong { display: block; margin-bottom: 7px; color: var(--ink); font-size: 16px; }
    
    /* Feedback & Confetti */
    .feedback {
      position: absolute; top: 94px; left: 50%; z-index: 70; min-width: 230px; display: grid;
      grid-template-columns: 42px 1fr; align-items: center; gap: 10px; padding: 10px 14px 10px 10px;
      border: 1px solid rgba(255, 255, 255, .55); border-radius: 8px; color: #fff; background: var(--green);
      box-shadow: 0 7px 20px rgba(24, 101, 61, .24); transform: translateX(-50%);
      animation: feedback-in .46s cubic-bezier(.2, 1.15, .3, 1);
    }
    .feedback.perfect { background: var(--blue); box-shadow: 0 7px 20px rgba(20, 104, 153, .24); }
    .feedback.error { background: var(--red); box-shadow: 0 7px 20px rgba(157, 36, 68, .22); }
    .feedback.refresh { background: #18aebd; }
    .feedback-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: #21633e; background: rgba(255,255,255,.88); }
    .feedback.perfect .feedback-icon { color: #176f9f; }
    .feedback.error .feedback-icon { color: #b32649; }
    .feedback strong, .feedback span { display: block; }
    .feedback strong { font-size: 13px; line-height: 18px; }
    .feedback span { margin-top: 2px; color: rgba(255,255,255,.84); font-size: 10px; line-height: 14px; }
    .confetti { position: absolute; inset: 0; pointer-events: none; }
    .confetti i { --angle: calc(var(--i) * 36deg); position: absolute; left: 50%; top: 50%; width: 5px; height: 9px; border-radius: 2px; background: #ffda55; animation: confetti-pop .62s ease-out forwards; transform: rotate(var(--angle)) translateY(-8px); }
    .confetti i:nth-child(3n) { background: #f04abc; }
    .confetti i:nth-child(3n + 1) { background: #9fe8ff; }
    
    /* Flying Star Effect for saving */
    .flying-star {
      position: absolute; z-index: 100; pointer-events: none;
      color: #ffb020; font-size: 20px; filter: drop-shadow(0 2px 6px rgba(255, 176, 32, 0.5));
      transition: all 0.55s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    /* Floating micro hearts on like */
    .micro-heart {
      position: absolute; z-index: 90; pointer-events: none;
      font-size: 16px; animation: float-heart .75s ease-out forwards;
    }
    @keyframes float-heart {
      0% { opacity: 1; transform: scale(.5) translateY(0); }
      50% { opacity: 1; transform: scale(1.2) translateY(-25px); }
      100% { opacity: 0; transform: scale(1) translateY(-50px); }
    }

    /* Entry Screen */
    .entry-screen { background: #fff; }
    .entry-screen .status-bar { flex: 0 0 30px; }
    .native-nav {

    }

    .entry-search-row {

    }
    .entry-search-side { display: grid; place-items: center; color: #22252b; }

    .entry-tabs {

    .entry-tabs .filter-button { display: grid; place-items: center; color: #25272c; }
    .entry-content { overflow: auto; padding: 0 14px 72px; flex: 1 1 auto; }

    .entry-post {

    }
    .entry-post-head { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 9px; }

    .entry-post-name { min-width: 0; }
    .entry-post-name strong, .entry-post-name small { display: block; }
    .entry-post-name strong { font-size: 14px; line-height: 19px; }
    .entry-post-name small { margin-top: 3px; color: #9297a0; font-size: 10px; line-height: 14px; }
    .entry-post-more { color: #989da5; background: transparent; }
    .entry-post-copy { margin: 11px 0 8px; color: #25282e; font-size: 14px; line-height: 21px; }
    .entry-post-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }

    .entry-post-grid span:nth-child(2) { background: linear-gradient(150deg, #5f4d46, #1a2028 48%, #bf9d84); }
    .entry-post-grid span:nth-child(3) { background: linear-gradient(145deg, #242a32, #66666c 48%, #181a1d); }
    .entry-post-tags { display: flex; gap: 8px; padding-top: 10px; }

    .entry-menu-layer {
      position: absolute; inset: 0; z-index: 25; pointer-events: none;
    }
    .entry-menu-backdrop {
      position: absolute; inset: 0; border: 0; background: rgba(27, 31, 39, .12);

    }
    .entry-action-menu {
      position: absolute; top: var(--entry-menu-top, 250px); right: 15px; width: min(244px, calc(100% - 30px));
      overflow: hidden; padding: 7px 0; border-radius: 18px; background: rgba(255,255,255,.98);
      box-shadow: 0 16px 36px rgba(37, 42, 55, .2), 0 2px 7px rgba(37, 42, 55, .08);

    }

      position: relative; width: 100%; min-height: 49px; display: flex; align-items: center; gap: 13px;

      transition: background .12s ease, color .12s ease;

    .entry-menu-item svg { flex: 0 0 auto; color: #777e89; }

    .entry-menu-divider { height: 1px; margin: 4px 16px; background: #eceef2; }
    .entry-bottom-nav {
      position: absolute; right: 0; bottom: 0; left: 0; z-index: 4; height: 62px;

      display: grid; justify-items: center; gap: 3px; color: #b1b4b9; background: transparent;
      font-size: 9px; line-height: 12px;
    }
    .entry-bottom-nav button.active { color: var(--purple); font-weight: 800; }
    
    .campaign-banner {
      position: relative; width: 100%; min-height: 96px; display: grid;
      grid-template-columns: 77px minmax(0, 1fr) 22px; align-items: center; gap: 11px;
      padding: 13px 14px 13px 13px; border: 1px solid rgba(255, 255, 255, .48);
      border-radius: 16px; color: #fff; background:
        linear-gradient(135deg, #5733d8 0%, #7047f5 52%, #8f61ee 100%);
      text-align: left; box-shadow: 0 4px #d9d2ff, 0 10px 22px rgba(91, 58, 211, .16);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .campaign-banner::after {
      content: ""; position: absolute; top: -22px; right: 28px; width: 92px; height: 92px;
      border: 1px solid rgba(255, 255, 255, .13); border-radius: 50%;
      box-shadow: 0 0 0 14px rgba(255, 255, 255, .035), 0 0 0 28px rgba(255, 255, 255, .025);
      pointer-events: none;
    }
    .campaign-banner:active {
      transform: translateY(2px);
      box-shadow: 0 2px #d9d2ff, 0 6px 16px rgba(91, 58, 211, .14);
    }
    .campaign-visual {
      position: relative; width: 77px; height: 66px; display: block; flex: 0 0 auto;
    }
    .campaign-sheet {
      position: absolute; display: block; width: 58px; height: 29px; padding: 8px 8px;
      border: 1px solid rgba(255, 255, 255, .48); border-radius: 8px;
      background: rgba(255, 255, 255, .17); box-shadow: 0 4px 9px rgba(48, 22, 136, .12);
      transform: rotate(-7deg);
    }
    .campaign-sheet::before, .campaign-sheet::after {
      content: ""; display: block; height: 4px; border-radius: 4px; background: currentColor;
    }
    .campaign-sheet::before { width: 34px; margin-bottom: 5px; opacity: .92; }
    .campaign-sheet::after { width: 22px; opacity: .5; }
    .campaign-sheet.before { top: 8px; left: 0; color: #ffd9e1; }
    .campaign-sheet.before::before { width: 39px; }
    .campaign-sheet.after {
      top: 28px; left: 13px; color: #d3ffed; background: rgba(255, 255, 255, .24);
      transform: rotate(6deg);
    }
    .campaign-sheet.after::before { width: 30px; }
    .campaign-pencil {
      position: absolute; right: 0; bottom: 2px; width: 27px; height: 27px; display: grid;
      place-items: center; border: 2px solid #7047f5; border-radius: 50%; color: #7047f5;
      background: #fff; box-shadow: 0 4px 9px rgba(42, 18, 123, .18); transform: rotate(-10deg);
    }
    .campaign-pencil svg { width: 16px; height: 16px; }
    .campaign-copy { display: grid; gap: 2px; }
    .campaign-copy strong { font-size: 18px; line-height: 24px; letter-spacing: 0; }
    .campaign-copy span { max-width: 178px; font-size: 12px; opacity: .9; line-height: 17px; }

    /* Leaderboard Screen */
    .leaderboard-screen { display: flex; flex-direction: column; background: #f5f7fb; }
    .leaderboard-nav { background: #fff; }
    .week-badge { justify-self: end; margin-right: 10px; padding: 4px 7px; border-radius: 7px; color: #5f39e7; background: #f0ecff; font-size: 9px; font-weight: 800; }
    .leader-meta { display: grid; gap: 8px; padding: 13px 14px 7px; }
    .leader-segment { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border-radius: 8px; background: #e8eaf0; }
    .leader-segment button { height: 34px; border-radius: 6px; color: #727780; background: transparent; font-size: 12px; font-weight: 700; transition: all .15s ease; }
    .leader-segment button.active { color: #5f39e7; background: #fff; box-shadow: 0 1px 3px rgba(38,42,53,.08); }
    .leader-meta > span { color: #969aa1; text-align: center; font-size: 9px; }
    .podium { height: 205px; display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 5px; padding: 12px 18px 15px; background: linear-gradient(180deg, #f0ecff, #ecf9fb); transition: opacity .2s ease; }
    .podium-person { display: grid; justify-items: center; gap: 3px; color: #656b74; }
    .podium-person.rank-1 { align-self: start; color: #6245d4; }
    .podium-person strong { max-width: 88px; overflow: hidden; color: #2b2f35; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .podium-person span { font-size: 10px; }
    .podium-avatar { position: relative; width: 66px; height: 66px; margin-bottom: 4px; }
    .rank-1 .podium-avatar { width: 78px; height: 78px; margin-top: 5px; }
    .podium-avatar .avatar-art { width: 100%; height: 100%; border: 4px solid #fff; font-size: 20px; }
    .podium-avatar b { position: absolute; left: 50%; bottom: -5px; width: 22px; height: 22px; display: grid; place-items: center; border: 2px solid #fff; border-radius: 50%; color: #fff; background: var(--blue); font-size: 10px; transform: translateX(-50%); }
    .rank-1 .podium-avatar b { background: #ffb020; }
    .rank-3 .podium-avatar b { background: #18b5c5; }
    .rank-heading { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 7px; }
    .rank-heading strong { font-size: 12px; }
    .rank-heading span { color: #9a9da4; font-size: 9px; }
    .rank-list { background: #fff; transition: opacity .2s ease; }
    .rank-row { height: 58px; display: grid; grid-template-columns: 25px 38px 1fr 34px; align-items: center; gap: 9px; padding: 0 16px; border-bottom: 1px solid #f0f1f4; }
    .rank-row > b { color: #8f939a; text-align: center; font-size: 12px; }
    .rank-row .avatar-art { width: 38px; height: 38px; font-size: 12px; }
    .rank-row strong { font-size: 12px; }
    .rank-row small { display: block; margin-top: 2px; color: #9297a0; font-size: 9px; }
    .rank-row > span { color: #5f39e7; text-align: right; font-size: 11px; font-weight: 800; }
    
    /* In-App Favorites Drawer (Solves Dead End on web) */
    .favorites-sheet-backdrop {
      position: absolute; inset: 0; z-index: 85; background: rgba(20, 24, 32, .45);
      backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .favorites-sheet-backdrop.is-open { opacity: 1; pointer-events: auto; }
    .favorites-sheet {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 50%; max-height: 50%; background: #fff;
      border-radius: 20px 20px 0 0; display: flex; flex-direction: column;
      transform: translateY(100%); transition: transform .32s cubic-bezier(.2, .9, .3, 1);
      box-shadow: 0 -10px 32px rgba(15, 23, 42, 0.16);
      overflow: hidden;
    }
    .favorites-sheet-backdrop.is-open .favorites-sheet { transform: translateY(0); }
    .favorites-sheet-handle { width: 36px; height: 4px; background: #dce1e9; border-radius: 99px; margin: 10px auto 4px; flex-shrink: 0; }
    .favorites-sheet-head {
      display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
      border-bottom: 1px solid var(--line); flex-shrink: 0; min-height: 48px;
    }
    .favorites-sheet-head strong { font-size: 14px; font-weight: 800; color: var(--ink); }
    .fav-head-close {
      background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700;
      padding: 5px 14px; border-radius: 99px; cursor: pointer; border: none;
      transition: all .12s ease;
    }
    .fav-head-close:hover { background: #e2e8f0; color: var(--ink); }

    .favorites-sheet-body {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 12px 14px 20px; display: flex; flex-direction: column; gap: 10px;
    }
    .favorites-sheet-body::-webkit-scrollbar { width: 4px; }
    .favorites-sheet-body::-webkit-scrollbar-thumb { background: #dce1e9; border-radius: 4px; }
    .favorite-item {
      padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fafbfc;
      flex-shrink: 0;
    }
    .favorite-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 11px; font-weight: 700; color: #626a76; }
    .favorite-item-actions { display: flex; align-items: center; gap: 5px; }
    .favorite-item-btn {
      font-size: 10px; padding: 2px 7px; border-radius: 4px; background: #fff;
      border: 1px solid #dce1e9; color: #475569; cursor: pointer; display: inline-flex; align-items: center; gap: 3px;
      transition: all .12s ease;
    }
    .favorite-item-btn:hover { background: #f1f5f9; color: var(--purple); }
    .favorite-item-btn.audio { color: var(--purple); background: #fbfaff; border-color: #e4ddff; }


    /* Sticky My Rank on Leaderboard */
    .my-rank-sticky {
      position: sticky; bottom: 0; left: 0; right: 0; z-index: 20;
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px);
      border-top: 1.5px solid #e2e8f0;
      padding: 10px 14px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.06);
    }
    .my-rank-info {
      display: flex; align-items: center; gap: 10px; min-width: 0;
    }
    .my-rank-badge {
      width: 24px; height: 24px; border-radius: 50%;
      background: #ede9fe; color: var(--purple); font-size: 11px; font-weight: 800;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .my-rank-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, #7047f5, #a855f7);
      color: #fff; font-size: 13px; font-weight: 800;
      display: grid; place-items: center; flex-shrink: 0;
      border: 2px solid #fff; box-shadow: 0 2px 6px rgba(112, 71, 245, 0.25);
    }
    .my-rank-text {
      min-width: 0; display: flex; flex-direction: column;
    }
    .my-rank-text strong {
      font-size: 13px; color: var(--ink); display: flex; align-items: center; gap: 6px;
    }
    .my-rank-text strong span.tag {
      font-size: 9px; padding: 1px 5px; border-radius: 4px; background: #e0f2fe; color: #0284c7; font-weight: 700;
    }
    .my-rank-text small {
      font-size: 10px; color: #64748b; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .my-rank-btn {
      height: 30px; padding: 0 11px; border-radius: 8px;
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: #fff; font-size: 11px; font-weight: 800;
      display: inline-flex; align-items: center; gap: 4px;
      cursor: pointer; flex-shrink: 0; box-shadow: 0 2px 8px rgba(112, 71, 245, 0.3);
      transition: transform .12s ease;
    }
    .my-rank-btn:active { transform: scale(0.96); }


    /* Toast */
    .toast {
      position: absolute; left: 50%; bottom: 28px; z-index: 90; max-width: calc(100% - 32px);
      padding: 11px 15px; border-radius: 12px; color: #fff; background: rgba(31,35,44,.92);
      box-shadow: 0 12px 30px rgba(43,51,76,.18); font-size: 12px; transform: translate(-50%, 20px);
      opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
    }
    .toast.is-visible { transform: translate(-50%, 0); opacity: 1; }

    @keyframes count-pop { from { transform: scale(.7); opacity: .3; } to { transform: scale(1); opacity: 1; } }
    @keyframes perfect-button-pop { 0% { transform: scale(1); } 45% { transform: scale(1.04); } 100% { transform: scale(1); } }
    @keyframes button-shake { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-4px); } 70% { transform: translateX(4px); } }
    @keyframes feedback-in { from { opacity: 0; transform: translate(-50%, -13px) scale(.92); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
    @keyframes confetti-pop { 0% { opacity: 1; transform: rotate(var(--angle)) translateY(-8px); } 100% { opacity: 0; transform: rotate(var(--angle)) translateY(-58px); } }
    @keyframes entry-menu-fade-in { to { opacity: 1; } }
    /* Top PM Enhancement Styles: Gamification, Audio, Social, and Filters */
    .streak-badge {
      display: inline-flex; align-items: center; gap: 2px; padding: 1px 7px; border-radius: 99px;
      background: linear-gradient(135deg, #ff5e3a, #ff9500); color: #fff; font-size: 9px; font-weight: 800;
      box-shadow: 0 2px 6px rgba(255, 94, 58, .35); animation: count-pop .3s ease-out;
    }
    .level-box {
      display: flex; flex-direction: column; gap: 3px; min-width: 136px;
      cursor: pointer; transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
      position: relative; -webkit-tap-highlight-color: transparent;
    }
    .level-box:hover { transform: translateY(-1px); }
    .level-box:active { transform: scale(0.97); }
    .level-box.is-leveling-up {
      animation: levelbox-glow 1.1s ease-in-out 3 alternate;
      border-color: #ffd700;
    }
    @keyframes levelbox-glow {
      0% { box-shadow: 0 3px rgba(42, 133, 146, .16), 0 0 0 0 rgba(250, 204, 21, 0.4); }
      100% { box-shadow: 0 3px rgba(42, 133, 146, .16), 0 0 14px 4px rgba(250, 204, 21, 0.75); transform: scale(1.04); }
    }
    .level-box.is-leveling-up .level-title svg {
      animation: trophy-wobble .5s ease-in-out infinite alternate;
      color: #f59e0b;
    }
    @keyframes trophy-wobble {
      0% { transform: translateY(0) rotate(-10deg) scale(1.1); }
      100% { transform: translateY(-2px) rotate(10deg) scale(1.3); }
    }
    .level-header { display: flex; align-items: center; justify-content: space-between; }
    .level-title { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 800; color: #1f474c; }
    .level-title svg { color: #1baeb0; transition: transform .2s ease; }
    .level-sub { font-size: 8px; color: #627b82; font-weight: 600; }
    .level-bar { width: 100%; height: 4px; background: rgba(27, 174, 176, .18); border-radius: 99px; overflow: hidden; position: relative; }
    .level-fill { height: 100%; background: #1baeb0; border-radius: 99px; transition: width .4s cubic-bezier(.2, .8, .2, 1); }
    .level-box.is-leveling-up .level-fill {
      background: linear-gradient(90deg, #1baeb0, #ffd700, #ff9500);
      background-size: 200% 100%;
      animation: fill-shimmer .8s linear infinite;
    }
    @keyframes fill-shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* ===== LEVEL UP CELEBRATION MODAL ===== */

      position: absolute; inset: 0; z-index: 3000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 18px;
      background: radial-gradient(circle at 50% 36%, rgba(28, 18, 56, 0.95), rgba(10, 6, 24, 0.98));
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      opacity: 0; pointer-events: none;
      transition: opacity .35s cubic-bezier(.16, 1, .3, 1);
      overflow: hidden;
    }
    .levelup-modal.is-active {
      opacity: 1; pointer-events: auto;
    }
    .levelup-sunburst {
      position: absolute; top: 34%; left: 50%;
      width: 480px; height: 480px;
      transform: translate(-50%, -50%);
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 215, 0, 0.13) 0deg 15deg,
        transparent 15deg 30deg
      );
      border-radius: 50%;
      pointer-events: none;
      animation: sunburst-spin 26s linear infinite;
    }
    .levelup-glow-core {
      position: absolute; top: 34%; left: 50%;
      width: 220px; height: 220px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 204, 0, 0.5) 0%, rgba(112, 71, 245, 0.35) 48%, transparent 70%);
      pointer-events: none;
      filter: blur(10px);
      animation: core-pulse 2.2s ease-in-out infinite alternate;
    }
    @keyframes sunburst-spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes core-pulse {
      0% { transform: translate(-50%, -50%) scale(0.88); opacity: 0.65; }
      100% { transform: translate(-50%, -50%) scale(1.18); opacity: 1; }
    }
    .levelup-confetti-wrap {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden;
    }
    .levelup-particle {
      position: absolute;
      top: 34%; left: 50%;
      width: var(--size, 8px); height: var(--size, 8px);
      background: var(--color, #ffd700);
      border-radius: var(--radius, 2px);
      opacity: 0;

    .levelup-modal.is-active .levelup-particle {
      animation: particle-burst var(--duration, 1.2s) cubic-bezier(.12, .8, .32, 1) var(--delay, 0s) forwards;
    }
    @keyframes particle-burst {
      0% {
        transform: translate(-50%, -50%) scale(0) rotate(0deg);
        opacity: 1;
      }
      60% { opacity: 1; }
      100% {
        transform: translate(calc(-50% + var(--tx, 0px)), calc(-50% + var(--ty, 0px))) scale(var(--scale, 1)) rotate(var(--rot, 360deg));
        opacity: 0;
      }
    }
    .levelup-card {
      position: relative; z-index: 10;
      width: 100%; max-width: 320px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      transform: scale(0.75) translateY(30px);
      transition: transform .55s cubic-bezier(.34, 1.56, .64, 1);
    }
    .levelup-modal.is-active .levelup-card {
      transform: scale(1) translateY(0);
    }
    .levelup-badge-halo {
      position: relative; width: 92px; height: 92px; margin-bottom: 14px;
      display: grid; place-items: center;
    }
    .levelup-badge-disc {
      width: 86px; height: 86px; border-radius: 50%;

      box-shadow: 0 0 32px rgba(245, 158, 11, 0.7), inset 0 2px 5px rgba(255, 255, 255, 0.85), inset 0 -4px 6px rgba(0, 0, 0, 0.3);
      display: grid; place-items: center; color: #fff;
      border: 3.5px solid #fffdf0;
      animation: trophy-float 2.4s ease-in-out infinite alternate;
    }
    .levelup-badge-disc svg {
      width: 44px; height: 44px;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3));

    .levelup-badge-stars {
      position: absolute; inset: -10px;
      pointer-events: none;
    }
    .badge-star {
      position: absolute; color: #fff5a6; font-size: 16px;
      animation: star-sparkle 1.8s ease-in-out infinite alternate;
    }
    .badge-star:nth-child(1) { top: -2px; left: 8px; animation-delay: 0.1s; }

    .badge-star:nth-child(3) { bottom: 6px; left: -4px; animation-delay: 0.55s; }
    @keyframes trophy-float {
      0% { transform: translateY(0) rotate(-2deg); }
      100% { transform: translateY(-7px) rotate(2deg); }
    }
    @keyframes star-sparkle {
      0% { transform: scale(0.7) rotate(0deg); opacity: 0.45; }
      100% { transform: scale(1.3) rotate(45deg); opacity: 1; }
    }

      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 12px; border-radius: 99px;
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.22), rgba(112, 71, 245, 0.32));

    .levelup-perk-item {

    function getLevelInfo(count) {
      const tierIndex = Math.min(Math.floor(count / 5), LEVEL_TIERS.length - 1);
      const currentTier = LEVEL_TIERS[tierIndex];
      const nextTier = LEVEL_TIERS[Math.min(tierIndex + 1, LEVEL_TIERS.length - 1)];
      const isMax = tierIndex >= LEVEL_TIERS.length - 1;
      const progressInTier = isMax ? 5 : (count % 5);
      const needRemaining = isMax ? 0 : (5 - progressInTier);
      const fillPercent = isMax ? 100 : Math.round((progressInTier / 5) * 100);
      return {
        level: currentTier.level,
        name: currentTier.name,
        title: currentTier.title,
        currentTier,
        nextTier,
        needRemaining,
        fillPercent,
        isMax
      };
    }

    function speakSentence(text, lang = "en-US", btn = null) {
      if (!('speechSynthesis' in window)) {
        showToast("当前环境暂不支持语音合成");
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = lang;
        u.rate = 0.92;
        if (btn) {
          btn.classList.add("is-speaking");
          u.onend = () => btn.classList.remove("is-speaking");
          u.onerror = () => btn.classList.remove("is-speaking");

    const emojiSequencePattern = /(?:[#*0-9]\uFE0F?\u20E3|(?:\p{Regional_Indicator}{2})|(?:\p{Extended_Pictographic}|\p{Emoji_Presentation})(?:\uFE0F|\uFE0E)?(?:\p{Emoji_Modifier})?(?:\u200D(?:\p{Extended_Pictographic}|\p{Emoji_Presentation})(?:\uFE0F|\uFE0E)?(?:\p{Emoji_Modifier})?)*)/gu;
    function removeEmoji(text) {
      return String(text).replace(emojiSequencePattern, "").replace(/[ \t]+\n/g, "\n").replace(/\n[ \t]+/g, "\n").trim();
    }
    function splitSentences(text) {
      const lines = text.split(/\n+/).map((line) => line.trim()).filter(Boolean);
      return lines.length > 1 ? lines : (text.match(/[^.!?。！？]+[.!?。！？]?/g) || [text]).map((line) => line.trim()).filter(Boolean);
    }
    function challengeLines(text) {
      const cleaned = removeEmoji(text);
      return cleaned ? splitSentences(cleaned) : [];
    }

    function diffMarkup(before, after, side) {
      const left = String(before);
      const right = String(after);
      let prefix = 0;
      while (prefix < left.length && prefix < right.length && left[prefix] === right[prefix]) prefix += 1;
      let suffix = 0;
      while (
        suffix < left.length - prefix &&
        suffix < right.length - prefix &&
        left[left.length - 1 - suffix] === right[right.length - 1 - suffix]
      ) suffix += 1;
      const unchangedStart = left.slice(0, prefix);
      const unchangedEnd = suffix ? left.slice(left.length - suffix) : "";
      const changed = side === "before"
        ? left.slice(prefix, suffix ? left.length - suffix : left.length)
        : right.slice(prefix, suffix ? right.length - suffix : right.length);
      return `${esc(unchangedStart)}${changed ? `<span class="${side === "before" ? "wrong" : "correct"}">${esc(changed)}</span>` : ""}${esc(unchangedEnd)}`;
    }

    function openCorrection(post) {
      const lines = challengeLines(post.text);
      if (!lines.length) {
        showToast("这条内容没有可改的文字");
        return;
      }
      post.state = "editing";
      post.originalLines = [...lines];
      post.editLines = [...lines];
      post.editingIndex = null;
      post.editValue = "";
      post.editError = "";
      updateFeedBoxOnly();
      requestAnimationFrame(() => {
        const card = root.querySelector(`[data-id="${post.id}"]`);
        card?.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    }

    function showFeedback(type, title, detail) {
      root.querySelector(".feedback")?.remove();
      const icon = type === "perfect" ? "heart" : type === "error" ? "x" : "check";
      const confetti = type === "error" ? "" : `<div class="confetti" aria-hidden="true">${Array.from({ length: 10 }, (_, index) => `<i style="--i:${index}"></i>`).join("")}</div>`;
      const el = document.createElement("div");
      el.className = `feedback ${type}`;
      el.innerHTML = `<div class="feedback-icon">${svgIcon(icon, 22)}</div><div><strong>${esc(title)}</strong><span>${esc(detail)}</span></div>${confetti}`;
      document.getElementById("screen-feed")?.appendChild(el);
      window.clearTimeout(feedbackTimer);
      feedbackTimer = window.setTimeout(() => el.remove(), 1200);
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("is-visible");
      toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 1900);
    }

    function removePost(post, message) {
      post.exiting = true;
      const card = root.querySelector(`[data-id="${post.id}"]`);
      if (card) {
        card.style.maxHeight = card.scrollHeight + "px";
        requestAnimationFrame(() => {
          card.classList.add("exiting");
        });
      }
      showToast(message);
      window.setTimeout(() => {
        posts = posts.filter((item) => item.id !== post.id);
        card?.remove();
        updateMetrics();
      }, 420);
    }

    function animateFlyStar(btn) {
      const starTarget = document.getElementById("btn-fav-star");
      if (!btn || !starTarget) return;
      const r1 = btn.getBoundingClientRect();
      const r2 = starTarget.getBoundingClientRect();
      const star = document.createElement("div");
      star.className = "flying-star";
      star.innerHTML = svgIcon("star", 20);
      star.style.left = `${r1.left + r1.width / 2 - 10}px`;
      star.style.top = `${r1.top}px`;
      document.body.appendChild(star);

      requestAnimationFrame(() => {
        star.style.left = `${r2.left + 8}px`;
        star.style.top = `${r2.top + 8}px`;
        star.style.transform = "scale(0.5)";
        star.style.opacity = "0.7";
      });

      setTimeout(() => {
        star.remove();
        const badge = starTarget.querySelector(".favorite-count");
        badge?.classList.add("bump");
        setTimeout(() => badge?.classList.remove("bump"), 250);
      }, 550);
    }

    function spawnMicroHearts(anchorEl) {
      for (let i = 0; i < 3; i++) {
        const heart = document.createElement("div");
        heart.className = "micro-heart";
        heart.innerHTML = svgIcon("heart", 14);
        const rect = anchorEl.getBoundingClientRect();
        heart.style.left = `${rect.left + rect.width / 2 + (i - 1) * 14}px`;
        heart.style.top = `${rect.top - 5}px`;
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 750);
      }
    }

    function updateFeedBoxOnly() {
      const box = document.getElementById("post-list-box");
      if (box) {
        box.innerHTML = renderFeedList();
        hydrateIcons(box);
        bindFeedActions(box);
      }
    }

    function switchScreen(targetScreen) {
      if (screen === targetScreen) return;
      screen = targetScreen;
      syncControls();

      const sEntry = document.getElementById("screen-entry");
      const sFeed = document.getElementById("screen-feed");
      const sLeader = document.getElementById("screen-leaderboard");

      if (screen === "entry") {
        sEntry.className = "app-screen entry-screen is-active";
        sFeed.className = "app-screen feed-screen is-right";
        sLeader.className = "app-screen leaderboard-screen is-right";
      } else if (screen === "feed") {
        sEntry.className = "app-screen entry-screen is-left";
        sFeed.className = "app-screen feed-screen is-active";
        sLeader.className = "app-screen leaderboard-screen is-right";
      } else if (screen === "leaderboard") {
        sEntry.className = "app-screen entry-screen is-left";
        sFeed.className = "app-screen feed-screen is-left";
        sLeader.className = "app-screen leaderboard-screen is-active";
      }
    }

    function syncControls() {
      document.querySelectorAll("[data-screen]").forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.screen === screen);
      });
    }

    function spawnExpFloat(anchorEl, text = "+15 EXP") {
      const rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0 };
      const float = document.createElement("div");
      float.className = "exp-float";
      float.innerHTML = text;
      float.style.left = `${rect.left + rect.width / 2 - 38}px`;
      float.style.top = `${rect.top - 12}px`;
      document.body.appendChild(float);
      setTimeout(() => float.remove(), 750);
    }

    function updateSummaryHeader() {
      const box = document.getElementById("activity-summary-box");
      if (!box) return;
      const lvl = getLevelInfo(challengeCount);
      box.innerHTML = `
        <div>
          <div style="display:flex;align-items:center;gap:5px;">
            <small>本周挑战</small>
            ${streak >= 2 ? `<span class="streak-badge">${svgIcon("sparkle", 11)} ${streak}连击</span>` : ""}
          </div>
          <strong><span>${challengeCount}</span> 次</strong>
        </div>
        <div class="summary-message level-box" data-action="preview-levelup" title="点击预览晋级特效动画">
          <div class="level-header">
            <span class="level-title">${svgIcon(lvl.currentTier.icon, 13)}<b>${esc(lvl.currentTier.title)}</b></span>
            <span class="level-sub">${lvl.isMax ? "已达最高荣誉" : `距晋级还差 ${lvl.needRemaining} 题`}</span>
          </div>
          <div class="level-bar"><div class="level-fill" style="width:${lvl.fillPercent}%;"></div></div>
        </div>
      `;
      hydrateIcons(box);
      const lvlBox = box.querySelector(".level-box");
      if (lvlBox) {
        lvlBox.addEventListener("click", () => showLevelUpModal());
      }
    }

    function updateMetrics() {
      const elCount = document.getElementById("metric-count");
      const elLikes = document.getElementById("metric-likes");
      const elSaved = document.getElementById("metric-saved");
      const elPosts = document.getElementById("metric-posts");
      if (elCount) elCount.textContent = String(challengeCount);
      if (elLikes) elLikes.textContent = String(likes);
      if (elSaved) elSaved.textContent = String(savedCount);
      if (elPosts) elPosts.textContent = String(posts.length);
      updateSummaryHeader();
    }

    function bindFeedActions(scope) {
      scope.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => {
          const action = button.dataset.action;
          const card = button.closest("[data-id]");
          const post = posts.find((item) => item.id === card?.dataset.id);

          if (action === "speak-sentence") {
            const text = button.dataset.text || "";
            const lang = button.dataset.lang || "en-US";
            speakSentence(text, lang, button);
            return;
          }

          if (action === "social-wave") {
            if (!post) return;
            post.hasGreeted = true;
            button.classList.add("done");
            button.innerHTML = `${svgIcon("check", 13)} <span>已打招呼</span>`;
            showToast(`已向 @${button.dataset.author} 发送语伴问候，期待开启对话！`);
            return;
          }

          if (action === "social-like" || action === "social-flower") {
            if (!post) return;
            post.hasLiked = true;
            button.classList.add("done");
            button.innerHTML = `${svgIcon("check", 13)} <span>已点赞</span>`;
            spawnMicroHearts(button);
            showToast(`已为 @${button.dataset.author} 顺手点赞！`);
            return;
          }

          // Accurate Multi-line Suggestion Replacement
          if (action === "quick-apply-suggestion") {
            if (!post || !post.correction) return;
            const original = post.originalLines || splitSentences(post.text);
            const edited = [...original];
            const c = post.correction;
            const wrongStr = (c.wrong || "").trim();
            const correctStr = (c.correct || "").trim();
            let replaced = false;

            for (let i = 0; i < edited.length; i++) {
              if (wrongStr && edited[i].includes(wrongStr)) {
                if (post.id === "sofia") {
                  edited[i] = edited[i].replace("recommended me to try", "recommended trying");
                } else if (post.id === "lina") {
                  edited[i] = edited[i].replace("started running", "went back to running");
                } else {
                  edited[i] = edited[i].replace(wrongStr, correctStr);
                }
                replaced = true;
                break;
              }
            }

            if (!replaced && c.correctedBefore !== undefined) {
              const fullTarget = ((c.originalBefore || "") + wrongStr + (c.originalAfter || "")).trim();
              const fullReplacement = ((c.correctedBefore || "") + correctStr + (c.correctedAfter || "")).trim();
              for (let i = 0; i < edited.length; i++) {
                if (fullTarget.includes(edited[i].trim()) || edited[i].trim().includes(fullTarget)) {
                  edited[i] = fullReplacement;
                  replaced = true;
                  break;
                }
              }
            }

            if (!replaced && correctStr && edited.length > 0) {
              edited[0] = edited[0].replace(wrongStr, correctStr);
            }

            post.editLines = edited;
            post.editingIndex = null;
            showToast("已采纳建议改法");
            updateFeedBoxOnly();
          }

          if (action === "perfect") {
            if (!post) return;
            if (failNext) {
              failNext = false;
              button.classList.add("error");
              showFeedback("error", "操作失败", "请稍后再试");
              return;
            }
            button.classList.add("success");
            button.innerHTML = `${svgIcon("heart", 19)}<span>已点赞</span>`;
            button.disabled = true;
            likes += 1;
            spawnExpFloat(button, "+5 EXP");
            updateMetrics();
            spawnMicroHearts(button);
            showFeedback("perfect", "顺手点赞", "表达地道，鼓励语伴 +5 EXP");
            window.setTimeout(() => removePost(post, "已鼓励语伴"), 650);
            return;
          }

          if (action === "edit") {
            if (post) openCorrection(post);
          }

          if (action === "edit-line") {
            if (!post) return;
            const currentTextarea = root.querySelector("#inline-line-editor");
            if (currentTextarea && Number.isInteger(post.editingIndex)) {
              const liveVal = currentTextarea.value.trim();
              if (liveVal && post.editLines) {
                post.editLines[post.editingIndex] = liveVal;
              }
            }
            post.editingIndex = Number(button.dataset.editIndex);
            post.editValue = post.editLines[post.editingIndex];
            post.editError = "";
            updateFeedBoxOnly();
            requestAnimationFrame(() => {
              const textarea = root.querySelector("#inline-line-editor");
              if (textarea) {
                textarea.focus();
                textarea.setSelectionRange(textarea.value.length, textarea.value.length);
                textarea.addEventListener("input", (e) => {
                  if (post && Number.isInteger(post.editingIndex)) {
                    post.editLines[post.editingIndex] = e.target.value;
                    post.editValue = e.target.value;
                  }
                });
              }
            });
          }


          if (action === "cancel-line") {
            if (!post) return;
            post.editingIndex = null;
            post.editValue = "";
            post.editError = "";
            updateFeedBoxOnly();
          }

          if (action === "save-line") {
            if (!post) return;
            const textarea = root.querySelector("#inline-line-editor");
            const value = textarea?.value.trim() || "";
            if (!value) {
              post.editError = "这一句不能为空";
              updateFeedBoxOnly();
              return;
            }
            post.editLines[post.editingIndex] = value;
            post.editingIndex = null;
            post.editValue = "";
            post.editError = "";
            updateFeedBoxOnly();
          }

          if (action === "cancel-correction") {
            if (!post) return;
            post.state = undefined;
            delete post.originalLines;
            delete post.editLines;
            delete post.editingIndex;
            delete post.editValue;
            delete post.editError;
            updateFeedBoxOnly();
          }

          if (action === "publish-inline-correction") {
            if (!post) return;
            const textarea = root.querySelector("#inline-line-editor");
            if (textarea && Number.isInteger(post.editingIndex)) {
              const liveVal = textarea.value.trim();
              if (liveVal) {
                if (!post.editLines) post.editLines = [...(post.originalLines || splitSentences(post.text))];
                post.editLines[post.editingIndex] = liveVal;
                post.editingIndex = null;
                post.editValue = "";
              }
            }
            const original = post.originalLines || splitSentences(post.text);
            const edited = post.editLines || [...original];
            if (edited.join("\n") === original.join("\n")) {
              post.editError = "请先修改一句话，再发布改错";
              updateFeedBoxOnly();
              return;
            }
            if (failNext) {
              failNext = false;
              document.getElementById("fail-next").classList.remove("is-active");
              post.editError = "发布失败，请稍后再试";
              updateFeedBoxOnly();
              showFeedback("error", "发布失败", "请检查后重新提交");
              return;
            }
            post.text = edited.join("\n");
            post.resultOriginal = original.join("\n");
            post.resultCorrected = edited.join("\n");
            post.resultChanges = getResultChanges(original, edited).map((change) => ({
              ...change,
              before: removeEmoji(change.before),
              after: removeEmoji(change.after)
            })).filter((change) => change.before && change.after && change.before !== change.after);
            post.state = "result";
            delete post.originalLines;
            delete post.editLines;
            delete post.editingIndex;
            delete post.editValue;
            delete post.editError;
            const prevLvl = getLevelInfo(challengeCount);
            challengeCount += 1;
            const newLvl = getLevelInfo(challengeCount);
            streak += 1;
            spawnExpFloat(button, "+15 EXP");
            updateMetrics();
            updateFeedBoxOnly();
            if (newLvl.level > prevLvl.level) {
              window.setTimeout(() => {
                showLevelUpModal(newLvl.currentTier, prevLvl.currentTier);
              }, 550);
            } else {
              if (streak >= 2) {
                showFeedback("success", `${streak} 连击达成！`, "持续帮助更多语伴吧");
              } else {
                showFeedback("success", "改错成功", "结果已经展示在当前内容位置");
              }
            }
          }

          if (action === "rush-leaderboard") {
            switchScreen("feed");
            showToast("开始改错，向更高排名冲刺！");
            return;
          }

          if (action === "preview-levelup") {
            showLevelUpModal();
            return;
          }

          if (action === "toggle-fav") {
            if (!post) return;
            post.isSaved = !post.isSaved;
            if (post.isSaved) {
              savedCount += 1;
              button.classList.add("is-saved");
              button.innerHTML = `${svgIcon("star", 15)} <span>已收藏</span>`;
              animateFlyStar(button);
              openSavedFavorites(post);
              showToast("已加入收藏");
            } else {
              savedCount = Math.max(0, savedCount - 1);
              button.classList.remove("is-saved");
              button.innerHTML = `${svgIcon("star", 15)} <span>收藏</span>`;
              savedFavoritesList = savedFavoritesList.filter(f => f.name !== post.name);
              showToast("已取消收藏");
            }
            updateMetrics();
            return;
          }

          if (action === "next-post") {
            if (!post) return;
            window.setTimeout(() => removePost(post, post.isSaved ? "已收藏，进入下一题" : "进入下一题"), 260);
            return;
          }

          if (action === "save-and-next" || action === "skip-and-next") {
            if (!post) return;
            const saved = action === "save-and-next";
            if (saved) {
              savedCount += 1;
              updateMetrics();
              openSavedFavorites(post);
              animateFlyStar(button);
            }
            window.setTimeout(() => removePost(post, saved ? "已收藏，进入下一题" : "已完成，进入下一题"), 260);
          }
        });
      });

      scope.querySelectorAll('[data-action="publish-inline-correction"]').forEach((btn) => {
        btn.addEventListener("pointerdown", () => {
          const textarea = root.querySelector("#inline-line-editor");
          if (textarea) {
            const card = btn.closest("[data-id]");
            const post = posts.find((item) => item.id === card?.dataset.id);
            if (post && Number.isInteger(post.editingIndex)) {
              const liveVal = textarea.value.trim();
              if (liveVal) {
                if (!post.editLines) post.editLines = [...(post.originalLines || splitSentences(post.text))];
                post.editLines[post.editingIndex] = liveVal;
              }
            }
          }
        });
      });
    }

    function bindScreenActions() {
      const select = document.getElementById("language-filter");
      if (select) {
        select.addEventListener("change", (e) => {
          filter = e.target.value;
          updateFeedBoxOnly();
        });
      }

      bindFeedActions(root);

      root.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => {
          const action = button.dataset.action;
          if (action === "feed") switchScreen("feed");
          if (action === "close") switchScreen("entry");
          if (action === "leaderboard") switchScreen("leaderboard");
          if (action === "open-favorites-tool") {
            showFavoritesSheet();
          }
          if (action === "close-favorites-sheet") {
            document.getElementById("favorites-sheet-backdrop")?.classList.remove("is-open");
          }
          if (action === "refresh") {
            showFeedback("refresh", "内容已更新", "为你带来新的挑战句子");
            posts = clonePosts();
            updateFeedBoxOnly();
            updateMetrics();
          }
          if (action === "leaderboard-tab") {
            leaderTab = button.dataset.tab;
            document.querySelectorAll("[data-action='leaderboard-tab']").forEach(b => b.classList.toggle("active", b.dataset.tab === leaderTab));
            document.getElementById("leader-meta-hint").textContent = leaderTab === "friends" ? "好友本周累计帮助人数" : "本周累计帮助人数";
            const podiumEl = document.getElementById("leader-podium-box");
            const listEl = document.getElementById("leader-rank-box");
            const myRankEl = document.getElementById("my-rank-sticky-box");
            if (podiumEl) podiumEl.innerHTML = renderPodium();
            if (listEl) listEl.innerHTML = renderRankList();
            if (myRankEl) {
              myRankEl.innerHTML = renderMyStickyRank();
              hydrateIcons(myRankEl);
              bindFeedActions(myRankEl);
            }
            hydrateIcons(podiumEl);
            hydrateIcons(listEl);
          }
          if (action === "rush-leaderboard") {
            switchScreen("feed");
            showToast("开始改错，向更高排名冲刺！");
          }
          if (action === "open-entry-menu") {
            entryMenu = true;
            entryMenuPostId = button.dataset.postId || "ben";
            renderApp();
          }
          if (action === "close-entry-menu") {
            entryMenu = false;
            entryMenuPostId = null;
            renderApp();
          }
          if (action === "entry-correction") {
            entryMenu = false;
            entryMenuPostId = null;
            switchScreen("feed");
            const target = posts.find((item) => item.id === "sofia") || posts[0];
            if (target) window.setTimeout(() => openCorrection(target), 120);
          }
          if (action === "entry-save" || action === "entry-feature" || action === "entry-hide" || action === "entry-report") {
            entryMenu = false;
            entryMenuPostId = null;
            renderApp();
            showToast(action === "entry-save" ? "已加入收藏" : action === "entry-report" ? "已收到你的举报" : action === "entry-hide" ? "已减少类似动态" : "已推荐为精选帖文");
          }
        });
      });
    }

    // Sidebar controls
    document.querySelectorAll("[data-screen]").forEach((btn) => {
      btn.addEventListener("click", () => switchScreen(btn.dataset.screen));
    });

    document.getElementById("empty-state").addEventListener("click", () => {
      switchScreen("feed");
      posts = [];
      updateFeedBoxOnly();
      updateMetrics();
      showToast("已切换至【无匹配内容】");
    });

    document.getElementById("upgrade-state").addEventListener("click", () => {
      showToast("当前版本过低，请升级后继续使用");
    });

    document.getElementById("fail-next").addEventListener("click", (e) => {
      failNext = !failNext;
      e.currentTarget.classList.toggle("is-active", failNext);
      showToast(failNext ? "下次操作将展示失败状态" : "已关闭失败状态");
    });

    document.getElementById("refresh-feed").addEventListener("click", () => {
      posts = clonePosts();
      switchScreen("feed");
      updateFeedBoxOnly();
      updateMetrics();
      showFeedback("refresh", "内容已更新", "为你带来新的挑战句子");
    });

    document.getElementById("trigger-levelup")?.addEventListener("click", () => {
      showLevelUpModal();
    });

    document.getElementById("set-almost-levelup")?.addEventListener("click", () => {
      challengeCount = 14;
      switchScreen("feed");
      updateMetrics();
      updateFeedBoxOnly();
      showToast("已设为差 1 题晋级");
    });

    document.getElementById("reset-demo").addEventListener("click", () => {
      posts = clonePosts();
      screen = "entry";
      filter = "all";
      challengeCount = 11;
      streak = 0;
      likes = 14;
      savedFavoritesList = [
        { name: "Lina", flag: "🇩🇪", language: "英语", changes: [{ before: "The weather became warmer, so I finally started running outside again.", after: "The weather became warmer, so I finally went back to running outside again." }] },
        { name: "Ren", flag: "🇯🇵", language: "英语", changes: [{ before: "I am looking forward to meet more people who enjoy hiking and photography.", after: "I am looking forward to meeting more people who enjoy hiking and photography." }] },
        { name: "Sofia", flag: "🇪🇸", language: "英语", changes: [{ before: "My friend recommended me to try this little restaurant near the river.", after: "My friend recommended trying this little restaurant near the river." }] },
        { name: "Mia", flag: "🇰🇷", language: "英语", changes: [{ before: "I’ve been a sushi chef for many years.", after: "I’ve been a sushi chef for many years." }] }
      ];
      savedCount = savedFavoritesList.length;
      leaderTab = "global";
      failNext = false;
      document.getElementById("fail-next").classList.remove("is-active");
      updateMetrics();
      renderApp();
      showToast("Demo 已重置");
    });

    // Initialize
    renderApp();
    updateMetrics();
  </script>
</body>
</html>
